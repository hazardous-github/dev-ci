name: Validation
run-name: Validation

on:
  push:
    branches: [main]
    paths:
      - 'requests/*.json'
  workflow_dispatch:
    inputs:
      target:
        description: Opaque target identifier
        required: true
        type: string
      revision:
        description: Exact 40-character source commit SHA
        required: true
        type: string
      suite:
        description: Opaque validation suite identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Resolve request
        id: request
        shell: pwsh
        env:
          DEV_CI_EVENT_NAME: ${{ github.event_name }}
          DEV_CI_INPUT_TARGET: ${{ inputs.target }}
          DEV_CI_INPUT_REVISION: ${{ inputs.revision }}
          DEV_CI_INPUT_SUITE: ${{ inputs.suite }}
          DEV_CI_REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          $harnessRoot = Join-Path $env:RUNNER_TEMP 'dev-ci-harness'
          New-Item -ItemType Directory -Force -Path $harnessRoot | Out-Null

          $rawRoot = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA"
          foreach ($scriptName in @('prepare.ps1', 'invoke.ps1')) {
              Invoke-WebRequest `
                  -Uri "$rawRoot/scripts/$scriptName" `
                  -OutFile (Join-Path $harnessRoot $scriptName)
          }

          if ($env:DEV_CI_EVENT_NAME -eq 'push') {
              $headers = @{
                  Authorization = "Bearer $env:DEV_CI_REPOSITORY_TOKEN"
                  Accept = 'application/vnd.github+json'
                  'X-GitHub-Api-Version' = '2022-11-28'
              }
              $commitUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA"
              $commit = Invoke-RestMethod -Method Get -Uri $commitUri -Headers $headers
              $requestPaths = @(
                  $commit.files |
                      ForEach-Object { [string]$_.filename } |
                      Where-Object { $_ -like 'requests/*.json' } |
                      Sort-Object -Unique
              )

              if ($requestPaths.Count -eq 0) {
                  'runnable=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  exit 0
              }
              if ($requestPaths.Count -ne 1 -or
                  $requestPaths[0] -notmatch '^requests/[A-Za-z0-9._-]+\.json$') {
                  throw 'A CI request commit must add or change exactly one valid request JSON file.'
              }

              $requestText = (Invoke-WebRequest -Uri "$rawRoot/$($requestPaths[0])").Content
              $request = $requestText | ConvertFrom-Json
              $target = [string]$request.target
              $revision = [string]$request.revision
              $suite = [string]$request.suite
          }
          else {
              $target = [string]$env:DEV_CI_INPUT_TARGET
              $revision = [string]$env:DEV_CI_INPUT_REVISION
              $suite = [string]$env:DEV_CI_INPUT_SUITE
          }

          if ($target -notmatch '^[A-Za-z0-9._-]{1,64}$' -or
              $suite -notmatch '^[A-Za-z0-9._-]{1,64}$' -or
              $revision -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'Invalid CI request.'
          }

          'runnable=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "suite=$suite" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "harness-root=$harnessRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare control plane
        id: control
        if: steps.request.outputs.runnable == 'true'
        shell: pwsh
        env:
          DEV_CI_CONTROL_REPOSITORY: ${{ secrets.DEV_CI_CONTROL_REPOSITORY }}
          DEV_CI_TOKEN: ${{ secrets.DEV_CI_TOKEN }}
          DEV_CI_HARNESS_ROOT: ${{ steps.request.outputs.harness-root }}
        run: |
          & (Join-Path $env:DEV_CI_HARNESS_ROOT 'prepare.ps1') `
              -Target '${{ steps.request.outputs.target }}' `
              -Revision '${{ steps.request.outputs.revision }}' `
              -Suite '${{ steps.request.outputs.suite }}'

      - name: Restore exact .NET SDK
        if: steps.request.outputs.runnable == 'true' && steps.control.outputs.use-runner-dotnet != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\dev-ci-dotnet
          key: dev-ci-dotnet-v1-${{ runner.os }}-${{ runner.arch }}-10.0.400

      - name: Set up exact .NET SDK
        if: steps.request.outputs.runnable == 'true' && steps.control.outputs.use-runner-dotnet != 'true'
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dev-ci-dotnet
        with:
          dotnet-version: '10.0.400'

      - name: Restore expanded BepInEx 5.4.23.5 core
        if: steps.control.outputs.plugin-cache-enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\dev-ci-cache\bepinex\win-x64\5.4.23.5
          key: el2-plugin-bepinex-core-win-x64-5.4.23.5-sha256-82f9878551030f54657792c0740d9d51a09500eeae1fba21106b0c441e6732c4

      - name: Restore EL2 managed runtime
        if: steps.control.outputs.plugin-cache-enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\dev-ci-cache\el2-managed-runtime
          key: el2-plugin-managed-runtime-v2-${{ steps.control.outputs.managed-runtime-revision }}

      - name: Run validation
        if: steps.request.outputs.runnable == 'true'
        shell: pwsh
        env:
          DEV_CI_CONTROL_REPOSITORY: ${{ secrets.DEV_CI_CONTROL_REPOSITORY }}
          DEV_CI_TOKEN: ${{ secrets.DEV_CI_TOKEN }}
          DEV_CI_RUN_ID: ${{ github.run_id }}
          DEV_CI_HARNESS_ROOT: ${{ steps.request.outputs.harness-root }}
          DEV_CI_INPUT_CACHE_ROOT: ${{ runner.temp }}\dev-ci-cache
          EL2_CI_MANAGED_RUNTIME_REVISION: ${{ steps.control.outputs.managed-runtime-revision }}
        run: |
          & (Join-Path $env:DEV_CI_HARNESS_ROOT 'invoke.ps1') `
              -Target '${{ steps.request.outputs.target }}' `
              -Revision '${{ steps.request.outputs.revision }}' `
              -Suite '${{ steps.request.outputs.suite }}' `
              -RunId $env:DEV_CI_RUN_ID `
              -ControlRoot '${{ steps.control.outputs.control-root }}'
